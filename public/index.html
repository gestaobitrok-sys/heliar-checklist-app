<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heliar Assistência Técnica — TROK Service</title>
<style>
  :root{
    --red:#C8102E;
    --red-dark:#970C22;
    --brand:#0F7A3D;
    --brand-dark:#0A5A2D;
    --brand-bg:#E7F5EC;
    --ink:#1C1C1C;
    --ink-soft:#4A4A4A;
    --line:#DDD7D0;
    --line-soft:#EDE9E4;
    --paper:#FBFAF8;
    --paper-alt:#F2EFEA;
    --amber:#B8791A;
    --green:#2E7D46;
    --green-bg:#E9F4EC;
    --red-bg:#FBEAEA;
    --amber-bg:#FBF1E1;
    --gray-bg:#EEECE8;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper-alt);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  header.topbar{
    background:var(--ink);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--brand);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:var(--brand);
    background:#fff;
  }
  .brand-text{line-height:1.15;}
  .brand-text .t1{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .brand-text .t2{font-size:11.5px;color:#C9C6C2;}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;}
  nav.tabs button{
    background:transparent;border:1px solid transparent;color:#D8D5D1;
    padding:8px 14px;border-radius:7px;font-size:13.5px;cursor:pointer;
    font-family:inherit;font-weight:500;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.08);}
  nav.tabs button.active{background:var(--brand);color:#fff;}

  main{flex:1;padding:22px;max-width:1180px;width:100%;margin:0 auto;}

  /* ---------- Cards / sections ---------- */
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .section-title{
    font-size:14px;font-weight:700;color:var(--brand-dark);
    margin:0 0 14px 0;padding-bottom:8px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .grid{display:grid;gap:14px;}
  .grid.c2{grid-template-columns:1fr 1fr;}
  .grid.c3{grid-template-columns:1fr 1fr 1fr;}
  .grid.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
  @media(max-width:760px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field .hint{font-size:11px;color:var(--amber);}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;
    padding:9px 10px;background:#fff;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand);}
  textarea{resize:vertical;min-height:70px;font-family:inherit;}
  input[type=checkbox]{width:auto;accent-color:var(--red);}

  .checklist-item{
    display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:start;
    padding:9px 0;border-bottom:1px dashed var(--line-soft);
  }
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .q{font-size:13.5px;line-height:1.4;}
  .checklist-item .hint{display:block;font-size:11px;color:var(--amber);margin-top:2px;}

  .radio-row{display:flex;gap:14px;flex-wrap:wrap;}
  .radio-pill{display:flex;align-items:center;gap:6px;font-size:13.5px;}
  .radio-pill input{width:auto;}

  .checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
  @media(max-width:760px){.checkbox-grid{grid-template-columns:1fr;}}
  .checkbox-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.35;}
  .checkbox-item input{margin-top:2px;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;
    border-radius:7px;padding:10px 16px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .btn:hover{background:var(--paper-alt);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-dark);}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn.danger{color:var(--red-dark);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

  /* ---------- Status badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.em_teste{background:var(--amber-bg);color:var(--amber);}
  .badge.procedente{background:var(--green-bg);color:var(--green);}
  .badge.improcedente{background:var(--red-bg);color:var(--red-dark);}

  /* ---------- List / table ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .filters .field{min-width:150px;}
  table.list{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.list th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);
  }
  table.list td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.list tr:hover{background:var(--paper-alt);cursor:pointer;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .mono{font-family:var(--mono);}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:760px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;}
  .stat .n{font-size:26px;font-weight:800;}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat .p{font-size:12px;font-weight:700;margin-top:2px;}
  .stat.em_teste .n{color:var(--amber);}
  .stat.procedente .n{color:var(--green);}
  .stat.improcedente .n{color:var(--red-dark);}
  .stat.procedente .p{color:var(--green);}
  .stat.improcedente .p{color:var(--red-dark);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);
    z-index:999;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .modal-back{
    position:fixed;inset:0;background:rgba(20,18,16,.5);
    display:flex;align-items:flex-start;justify-content:center;
    padding:30px 16px;overflow:auto;z-index:500;
  }
  .modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:24px;}

  .breadcrumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .breadcrumb button{background:none;border:none;color:var(--red-dark);cursor:pointer;font-weight:600;font-size:12.5px;padding:0;}

  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .detail-title{font-size:19px;font-weight:800;}
  .detail-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;font-size:13.5px;}
  .kv b{color:var(--ink-soft);font-weight:600;font-size:12px;}

  .tag-list{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{background:var(--paper-alt);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;}
  .tag.bad{background:var(--red-bg);border-color:#EAC9C9;color:var(--red-dark);}
  .tag.good{background:var(--green-bg);border-color:#C9E3CE;color:var(--green);}

  .unit-card{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .unit-card:last-child{border-bottom:none;}

  footer.hint-bar{padding:14px 22px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

  /* ---------- Print ---------- */
  #print-area{display:none;}
  @page{ margin:0; }
  @media print{
    header.topbar, nav.tabs, .no-print, footer.hint-bar, #toast{display:none !important;}
    body{background:#fff;margin:0;}
    #app{display:none !important;min-height:0 !important;}
    main{display:none !important;}
    #print-area{display:block !important;}
    #print-area *{visibility:visible;}
    .p-page{padding:12mm 10mm;font-family:var(--sans);color:#111;page-break-after:always;box-sizing:border-box;width:210mm;min-height:297mm;}
    .p-page:last-child{page-break-after:auto;}
    .p-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0F7A3D;padding-bottom:8px;margin-bottom:12px;}
    .p-head .logo{font-weight:800;color:#0F7A3D;font-size:18px;}
    .p-head .doc-title{font-weight:700;font-size:14px;}
    .p-head .doc-meta{font-size:11px;text-align:right;color:#444;}
    .p-block{border:1px solid #ccc;border-radius:4px;margin-bottom:10px;break-inside:avoid;}
    .p-row{display:flex;border-bottom:1px solid #ccc;break-inside:avoid;}
    .p-row:last-child{border-bottom:none;}
    .p-cell{flex:1;padding:6px 8px;font-size:11px;border-right:1px solid #ccc;}
    .p-cell:last-child{border-right:none;}
    .p-cell b{display:block;font-size:9px;text-transform:uppercase;color:#666;margin-bottom:2px;}
    .p-section-title{font-size:11.5px;font-weight:700;margin:12px 0 5px;color:#0F7A3D;break-after:avoid;break-inside:avoid;}
    .p-check-line{font-size:10.8px;padding:2px 0;display:flex;justify-content:space-between;border-bottom:1px dotted #ddd;break-inside:avoid;}
    .p-check-line span.answer{font-weight:700;}
    .p-defects{font-size:10.5px;columns:2;column-gap:16px;}
    .p-defects div{padding:1px 0;break-inside:avoid;}
    .p-defects div.checked{font-weight:700;}
    .p-sig{margin-top:34px;display:flex;justify-content:space-around;text-align:center;font-size:10.5px;}
    .p-sig div{border-top:1px solid #333;padding-top:5px;width:220px;}
    .p-decision{font-size:12px;font-weight:800;margin:10px 0;padding:8px;border-radius:4px;}
    .p-decision.procedente{background:#E9F4EC;color:#2E7D46;}
    .p-decision.improcedente{background:#FBEAEA;color:#970C22;}
    .p-decision.em_teste{background:#FBF1E1;color:#B8791A;}
    .p-obs{font-size:10.5px;border:1px solid #ccc;border-radius:4px;padding:6px 8px;min-height:30px;margin-top:4px;}
    .p-legal{font-size:9px;color:#555;margin-top:14px;line-height:1.4;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">TS</div>
      <div class="brand-text">
        <div class="t1">Heliar · Assistência Técnica</div>
        <div class="t2">TROK Service</div>
      </div>
    </div>
    <nav class="tabs" id="tabnav">
      <button data-tab="novo">Novo Atendimento</button>
      <button data-tab="lista">Atendimentos</button>
      <button data-tab="unidades" id="tab-cadastros" style="display:none;">Cadastros</button>
      <button data-tab="usuarios" id="tab-usuarios" style="display:none;">Usuários</button>
    </nav>
    <div id="user-box" style="display:flex;align-items:center;gap:10px;"></div>
  </header>
  <main id="main"></main>
  <footer class="hint-bar">Dados salvos no servidor Heliar · TROK Service</footer>
</div>

<div id="print-area"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================= STATE ============================= */
let state = { unidades: [], tecnicos: [], marcas: [], atendimentos: [] };
let currentTab = 'novo';
let currentDetailId = null;
let editingId = null; // id being edited in the form, null = new
let currentUser = null;

/* ============================= API (servidor Heliar) =============================
   O app fala com o backend Node/Express via fetch(). A sessão é controlada por um
   cookie httpOnly (setado no login), então basta credentials:'include'.
   Se a sessão expirar/for inválida (401), mandamos o usuário de volta pro login. */
async function api(path, opts){
  opts = opts || {};
  const res = await fetch('/api' + path, Object.assign({
    credentials: 'include',
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined
  }, opts));
  if(res.status === 401){
    goToLogin();
    throw new Error('sessão expirada');
  }
  let body = null;
  try{ body = await res.json(); }catch(e){ /* resposta sem corpo */ }
  if(!res.ok){
    throw new Error((body && body.error) || ('Erro ' + res.status));
  }
  return body;
}

function goToLogin(){
  currentUser = null;
  window.location.href = '/login.html';
}

/* ============================= AUTENTICAÇÃO ============================= */
async function checkAuth(){
  const res = await fetch('/api/auth/me', { credentials: 'include' });
  if(!res.ok) return null;
  return res.json();
}
async function logout(){
  try{ await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); }catch(e){ /* ignora */ }
  goToLogin();
}

/* ============================= STORAGE (via API) ============================= */
async function loadState(){
  const [unidades, tecnicos, marcas, atendimentos, motivos] = await Promise.all([
    api('/unidades'), api('/tecnicos'), api('/marcas'), api('/atendimentos'), api('/motivos')
  ]);
  state.unidades = unidades;
  state.tecnicos = tecnicos;
  state.marcas = marcas;
  state.atendimentos = atendimentos;
  MOTIVOS = motivos;
}

async function createUnidade(data){ const u = await api('/unidades', {method:'POST', body:JSON.stringify(data)}); state.unidades.push(u); return u; }
async function updateUnidade(id, data){ const u = await api('/unidades/'+id, {method:'PUT', body:JSON.stringify(data)}); const i = state.unidades.findIndex(x=>x.id===id); if(i>=0) state.unidades[i]=u; return u; }
async function deleteUnidade(id){ await api('/unidades/'+id, {method:'DELETE'}); state.unidades = state.unidades.filter(u=>u.id!==id); }

async function createTecnico(data){ const t = await api('/tecnicos', {method:'POST', body:JSON.stringify(data)}); state.tecnicos.push(t); return t; }
async function updateTecnico(id, data){ const t = await api('/tecnicos/'+id, {method:'PUT', body:JSON.stringify(data)}); const i = state.tecnicos.findIndex(x=>x.id===id); if(i>=0) state.tecnicos[i]=t; return t; }
async function deleteTecnico(id){ await api('/tecnicos/'+id, {method:'DELETE'}); state.tecnicos = state.tecnicos.filter(t=>t.id!==id); }

async function createMarca(data){ const m = await api('/marcas', {method:'POST', body:JSON.stringify(data)}); state.marcas.push(m); return m; }
async function deleteMarca(id){ await api('/marcas/'+id, {method:'DELETE'}); state.marcas = state.marcas.filter(m=>m.id!==id); }

/* ============================= HELPERS ============================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(v){ return (v===undefined||v===null?'':String(v)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function isoLocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoLocal(new Date()); }
function startOfWeekISO(){
  const now = new Date(); const d = new Date(now);
  d.setDate(now.getDate() - now.getDay());
  return isoLocal(d);
}
function startOfMonthISO(){
  const now = new Date();
  return isoLocal(new Date(now.getFullYear(), now.getMonth(), 1));
}
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d && m && y ? `${d}/${m}/${y}` : iso; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2400);
}
function get(obj, path){
  return path.split('.').reduce((o,k)=> (o && o[k]!==undefined) ? o[k] : undefined, obj);
}

/* ============================= MOTIVOS (Cod Motivo x Descrição) =============================
   Vem do servidor (aba "Laudo" da planilha de garantia da TROK) — carregado em loadState().
   Substitui as antigas listas de checkbox de defeitos procedentes/improcedentes. */
let MOTIVOS = [];
function motivoDescricao(codigo){
  const m = MOTIVOS.find(x=>x.codigo===codigo);
  return m ? m.descricao : '';
}

/* ============================= FORM RENDER HELPERS ============================= */
function fieldText(name, label, value, opts){
  opts = opts || {};
  return `<div class="field">
    <label for="f_${name}">${label}${opts.required?' *':''}</label>
    <input id="f_${name}" type="${opts.type||'text'}" name="${name}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}" ${opts.required?'required':''}>
  </div>`;
}
function fieldTextarea(name, label, value){
  return `<div class="field">
    <label for="f_${name}">${label}</label>
    <textarea id="f_${name}" name="${name}">${esc(value)}</textarea>
  </div>`;
}
function fieldSelect(name, label, value, options, opts){
  opts = opts || {};
  const opt = options.map(o=>{
    const val = typeof o==='object'?o.value:o;
    const lab = typeof o==='object'?o.label:o;
    return `<option value="${esc(val)}" ${String(value)===String(val)?'selected':''}>${esc(lab)}</option>`;
  }).join('');
  return `<div class="field">
    <label for="f_${name}">${label}${opts.required?' *':''}</label>
    <select id="f_${name}" name="${name}" ${opts.required?'required':''}>
      <option value="">—</option>${opt}
    </select>
  </div>`;
}
function yesNo(name, label, value, hint){
  return `<div class="checklist-item">
    <div class="q">${label}${hint?`<span class="hint">${hint}</span>`:''}</div>
    <div class="radio-row">
      <label class="radio-pill"><input type="radio" name="${name}" value="sim" ${value==='sim'?'checked':''}> Sim</label>
      <label class="radio-pill"><input type="radio" name="${name}" value="nao" ${value==='nao'?'checked':''}> Não</label>
    </div>
  </div>`;
}

/* ============================= FORM -> OBJECT ============================= */
function formToObject(form){
  const fd = new FormData(form);
  const obj = {};
  for(const [key, value] of fd.entries()){
    const isArray = key.endsWith('[]');
    const cleanKey = isArray ? key.slice(0,-2) : key;
    const parts = cleanKey.split('.');
    let cur = obj;
    for(let i=0;i<parts.length-1;i++){
      cur[parts[i]] = cur[parts[i]] || {};
      cur = cur[parts[i]];
    }
    const last = parts[parts.length-1];
    if(isArray){
      cur[last] = fd.getAll(key);
    } else {
      cur[last] = value;
    }
  }
  return obj;
}
function deepMerge(target, src){
  for(const k in src){
    if(src[k] && typeof src[k]==='object' && !Array.isArray(src[k])){
      target[k] = target[k] && typeof target[k]==='object' ? target[k] : {};
      deepMerge(target[k], src[k]);
    } else {
      target[k] = src[k];
    }
  }
  return target;
}

/* ============================= RENDER: TABS ============================= */
function setTab(tab){
  currentTab = tab;
  currentDetailId = null;
  document.querySelectorAll('#tabnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}
document.getElementById('tabnav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(btn) setTab(btn.dataset.tab);
});

/* ============================= RENDER: MAIN ============================= */
function render(){
  const main = document.getElementById('main');
  if(currentTab === 'novo'){
    main.innerHTML = renderAtendimentoForm(editingId ? state.atendimentos.find(a=>a.id===editingId) : null);
    bindFormEvents();
  } else if(currentTab === 'lista'){
    if(currentDetailId){
      main.innerHTML = renderDetail(state.atendimentos.find(a=>a.id===currentDetailId));
      bindDetailEvents();
    } else {
      main.innerHTML = renderLista();
      bindListaEvents();
    }
  } else if(currentTab === 'unidades'){
    main.innerHTML = renderUnidades();
    bindUnidadesEvents();
  } else if(currentTab === 'usuarios'){
    if(!currentUser || currentUser.role !== 'admin'){
      main.innerHTML = '<div class="empty">Apenas administradores podem acessar esta área.</div>';
      return;
    }
    main.innerHTML = '<div class="card"><div class="empty">Carregando usuários…</div></div>';
    renderUsuarios().then(html=>{ main.innerHTML = html; bindUsuariosEvents(); });
  }
}

/* ============================= NOVO / EDITAR ATENDIMENTO ============================= */
function tecnicoOptionsForUnidade(unidadeId){
  return state.tecnicos.filter(t=> !unidadeId || t.unidade_id===unidadeId).map(t=>({value:t.nome, label:t.nome}));
}

function hasFotos(a){
  return (a.foto_count && a.foto_count > 0) || !!a.tem_comprovante;
}
async function loadFotosFor(a){
  try{
    const r = await api('/atendimentos/' + a.id + '/fotos');
    return (r && r.fotos) || [];
  }catch(e){
    console.error('Erro ao carregar fotos do atendimento', a.id, e);
    return [];
  }
}
async function saveFotosFor(atendimentoId, base64Array){
  try{
    await api('/atendimentos/' + atendimentoId + '/fotos', { method:'PUT', body: JSON.stringify({ fotos: base64Array }) });
    return true;
  }catch(e){
    console.error('Erro ao salvar fotos do atendimento', atendimentoId, e);
    return false;
  }
}
function bindFormEvents(){
  const form = document.getElementById('atendimento-form');
  const existing = editingId ? state.atendimentos.find(a=>a.id===editingId) : null;
  let submitting = false;

  // estado local das fotos deste formulário (lista única, existentes + novas), até o envio
  let fotoState = []; // array de strings base64 (jpeg)

  function renderFotoThumb(container, base64, onRemove){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;width:90px;height:90px;';
    const img = document.createElement('img');
    img.style.cssText = 'width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);';
    img.src = 'data:image/jpeg;base64,' + base64;
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '×';
    rm.title = 'Remover';
    rm.style.cssText = 'position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red-dark);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:1;';
    rm.addEventListener('click', onRemove);
    wrap.appendChild(img); wrap.appendChild(rm);
    container.appendChild(wrap);
  }
  function renderFotoPreview(){
    const box = document.getElementById('foto-preview');
    if(!box) return;
    box.innerHTML = '';
    if(fotoState.length===0){
      box.innerHTML = '<span class="muted">Nenhuma foto anexada</span>';
      return;
    }
    fotoState.forEach((base64, idx)=>{
      renderFotoThumb(box, base64, ()=>{
        fotoState.splice(idx,1);
        renderFotoPreview();
      });
    });
  }

  // trocar a unidade atualiza a lista de técnicos disponíveis
  const unidadeSelect = document.getElementById('f_unidade_id');
  const tecnicoSelect = document.getElementById('f_laudo.tecnico');
  if(unidadeSelect && tecnicoSelect){
    unidadeSelect.addEventListener('change', ()=>{
      const opts = tecnicoOptionsForUnidade(unidadeSelect.value);
      tecnicoSelect.innerHTML = '<option value="">—</option>' + opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
    });
  }


  // carrega fotos já anexadas (modo edição)
  if(existing && hasFotos(existing)){
    document.getElementById('foto-preview').innerHTML = '<span class="muted">Carregando fotos…</span>';
    loadFotosFor(existing).then(fotos=>{
      fotoState = fotos;
      renderFotoPreview();
    });
  }

  const fotoInput = document.getElementById('foto-input');
  fotoInput.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files || []);
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
          fotoState.push(dataUrl.split(',')[1]);
          renderFotoPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    fotoInput.value = '';
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(submitting) return;
    submitting = true;
    const submitBtn = form.querySelector('button[type=submit]');
    if(submitBtn) submitBtn.disabled = true;

    const data = formToObject(form);
    delete data.tem_comprovante;
    const isNew = !editingId;

    try{
      let target;
      if(isNew){
        target = await api('/atendimentos', { method:'POST', body: JSON.stringify(data) });
        state.atendimentos.unshift(target);
      } else {
        const merged = Object.assign({}, state.atendimentos.find(a=>a.id===editingId));
        deepMerge(merged, data);
        delete merged.tem_comprovante;
        target = await api('/atendimentos/' + editingId, { method:'PUT', body: JSON.stringify(merged) });
        const i = state.atendimentos.findIndex(a=>a.id===editingId);
        if(i>=0) state.atendimentos[i] = target;
      }

      // dados do atendimento já estão salvos no servidor neste ponto — agora as fotos
      const fotosOk = await saveFotosFor(target.id, fotoState);
      target.foto_count = fotosOk ? fotoState.length : (target.foto_count || 0);

      if(fotosOk){
        toast(isNew ? ('Atendimento registrado — laudo ' + target.laudo_numero) : 'Atendimento atualizado');
        editingId = null;
        currentTab = 'lista';
        currentDetailId = target.id;
        setTab('lista');
        return;
      } else {
        // mantém o formulário aberto na mesma edição, pra poder reenviar só as fotos
        editingId = target.id;
        toast('Atendimento salvo, mas as fotos não foram salvas (provavelmente por serem grandes demais) — tente reenviar');
      }
    }catch(err){
      console.error('Erro ao salvar atendimento', err);
      toast('Erro ao salvar o atendimento — verifique a conexão e tente novamente');
    }

    submitting = false;
    if(submitBtn) submitBtn.disabled = false;
  });
  const cancelBtn = document.getElementById('btn-cancel-edit');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingId=null; setTab('lista'); });
}


/* ============================= LISTA / RELATÓRIOS ============================= */
function filteredAtendimentos(){
  const status = document.getElementById('f-status') ? document.getElementById('f-status').value : '';
  const unidade = document.getElementById('f-unidade') ? document.getElementById('f-unidade').value : '';
  const de = document.getElementById('f-data-de') ? document.getElementById('f-data-de').value : '';
  const ate = document.getElementById('f-data-ate') ? document.getElementById('f-data-ate').value : '';
  const busca = document.getElementById('f-busca') ? document.getElementById('f-busca').value.trim().toLowerCase() : '';

  return state.atendimentos.filter(a=>{
    const st = (a.laudo && a.laudo.status) || 'em_teste';
    if(status && st !== status) return false;
    if(unidade && a.unidade_id !== unidade) return false;
    if(de && (!a.data || a.data < de)) return false;
    if(ate && (!a.data || a.data > ate)) return false;
    if(busca){
      const hay = [
        a.cliente && a.cliente.nome, a.cliente && a.cliente.cpf,
        a.veiculo && a.veiculo.placa, a.laudo_numero,
        a.bateria && a.bateria.cod_sku, a.bateria && a.bateria.cod_fabricacao
      ].join(' ').toLowerCase();
      if(!hay.includes(busca)) return false;
    }
    return true;
  });
}
function statusLabel(st){
  return st==='procedente' ? 'Procedente' : st==='improcedente' ? 'Improcedente' : 'Em teste';
}
function unidadeNome(id){
  const u = state.unidades.find(u=>u.id===id);
  return u ? u.nome : '—';
}

      <div class="filters no-print" style="margin-bottom:4px;">

        <div class="field"><label>Até</label><input id="ge-data-ate" type="date"></div>
      </div>
      <div class="btn-row" style="margin-top:0;">
        <button type="button" class="btn primary" id="btn-exportar-garantia">⬇ Exportar planilha de garantia (.xlsx)</button>
      </div>
    </div>` : '';

  const html = `
    ${exportCard}
    <div class="stat-row" id="stat-row"></div>
    <div class="card">
      <div class="section-title">Atendimentos</div>
      <div class="filters no-print">
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="">Todos</option>
            <option value="em_teste">Em teste</option>
            <option value="procedente">Procedente</option>
            <option value="improcedente">Improcedente</option>
          </select>
        </div>
        <div class="field">
          <label>Unidade</label>
          <select id="f-unidade"><option value="">Todas</option>${unidadeOptions}</select>
        </div>
        <div class="field">
          <label>De</label>
          <input id="f-data-de" type="date">
        </div>
        <div class="field">
          <label>Até</label>
          <input id="f-data-ate" type="date">
        </div>
        <div class="field" style="flex:1;min-width:180px;">
          <label>Buscar (nome, CPF, placa, laudo)</label>
          <input id="f-busca" type="text" placeholder="Buscar...">
        </div>
      </div>
      <div class="btn-row no-print" style="margin-top:-4px;margin-bottom:14px;">
        <button type="button" class="btn small" id="qf-hoje">Hoje</button>
        <button type="button" class="btn small" id="qf-semana">Esta semana</button>
        <button type="button" class="btn small" id="qf-mes">Este mês</button>
        <button type="button" class="btn small" id="qf-limpar">Limpar datas</button>
      </div>
      <div id="lista-tabela"></div>

  return html;
}
function renderStats(list){
  const total = list.length;
  const emTeste = list.filter(a=>((a.laudo&&a.laudo.status)||'em_teste')==='em_teste').length;
  const procedente = list.filter(a=>(a.laudo&&a.laudo.status)==='procedente').length;
  const improcedente = list.filter(a=>(a.laudo&&a.laudo.status)==='improcedente').length;
  const pct = (n) => total > 0 ? `${((n/total)*100).toFixed(1)}%` : '—';
  return `
    <div class="stat"><div class="n">${total}</div><div class="l">Total no filtro</div></div>
    <div class="stat em_teste"><div class="n">${emTeste}</div><div class="l">Em teste</div></div>
    <div class="stat procedente"><div class="n">${procedente}</div><div class="l">Procedentes</div><div class="p">${pct(procedente)}</div></div>
    <div class="stat improcedente"><div class="n">${improcedente}</div><div class="l">Improcedentes</div><div class="p">${pct(improcedente)}</div></div>
  `;
}
function renderTabela(list){
  if(list.length===0){
    return `<div class="empty"><div class="big">—</div>Nenhum atendimento encontrado com esses filtros.</div>`;
  }
  const rows = list.map(a=>{
    const st = (a.laudo && a.laudo.status) || 'em_teste';
    return `<tr data-id="${esc(a.id)}">
      <td class="mono">${esc(a.laudo_numero)}</td>
      <td>${fmtDate(a.data)}</td>
      <td>${esc(a.cliente && a.cliente.nome) || '—'}</td>
      <td class="mono">${esc(a.veiculo && a.veiculo.placa) || '—'}</td>
      <td class="mono">${esc(a.bateria && a.bateria.cod_sku) || '—'}</td>
      <td>${esc(unidadeNome(a.unidade_id))}</td>
      <td>${hasFotos(a) ? '📎' : '—'}</td>
      <td><span class="badge ${st}">${statusLabel(st)}</span></td>
    </tr>`;
  }).join('');
  return `<table class="list">
    <thead><tr><th>Laudo</th><th>Data</th><th>Cliente</th><th>Placa</th><th>Cod SKU</th><th>Unidade</th><th>Comprovante</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
function refreshLista(){
  const list = filteredAtendimentos();
  document.getElementById('stat-row').innerHTML = renderStats(list);
  document.getElementById('lista-tabela').innerHTML = renderTabela(list);
  document.querySelectorAll('#lista-tabela tr[data-id]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      currentDetailId = tr.dataset.id;
      render();
    });
  });
}
function bindListaEvents(){
  refreshLista();
  ['f-status','f-unidade','f-data-de','f-data-ate'].forEach(id=>{
    document.getElementById(id).addEventListener('change', refreshLista);
  });
  document.getElementById('f-busca').addEventListener('input', refreshLista);
  document.getElementById('qf-hoje').addEventListener('click', ()=>{
    document.getElementById('f-data-de').value = todayISO();
    document.getElementById('f-data-ate').value = todayISO();
    refreshLista();
  });
  document.getElementById('qf-semana').addEventListener('click', ()=>{
    document.getElementById('f-data-de').value = startOfWeekISO();
    document.getElementById('f-data-ate').value = todayISO();
    refreshLista();
  });
  document.getElementById('qf-mes').addEventListener('click', ()=>{
    document.getElementById('f-data-de').value = startOfMonthISO();
    document.getElementById('f-data-ate').value = todayISO();
    refreshLista();
  });
  document.getElementById('qf-limpar').addEventListener('click', ()=>{
    document.getElementById('f-data-de').value = '';
    document.getElementById('f-data-ate').value = '';
    refreshLista();
  });

  const btnExportarGarantia = document.getElementById('btn-exportar-garantia');
  if(btnExportarGarantia){
    btnExportarGarantia.addEventListener('click', async ()=>{
      const de = document.getElementById('ge-data-de').value;
      const ate = document.getElementById('ge-data-ate').value;
      const params = new URLSearchParams();
      if(de) params.set('de', de);
      if(ate) params.set('ate', ate);
      btnExportarGarantia.disabled = true;
      const textoOriginal = btnExportarGarantia.textContent;
      btnExportarGarantia.textContent = 'Gerando…';
      try{
        const res = await fetch('/api/garantia/export?' + params.toString(), { credentials:'include' });
        if(res.status === 401){ goToLogin(); return; }
        if(!res.ok){
          const body = await res.json().catch(()=>({}));
          throw new Error(body.error || ('Erro ' + res.status));
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const hoje = new Date().toISOString().slice(0,10);
        a.href = url; a.download = `garantia-procedentes-${hoje}.xlsx`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        toast('Planilha de garantia exportada');
      }catch(err){
        console.error('Erro ao exportar planilha de garantia', err);
        toast('Erro ao exportar planilha: ' + err.message);
      }
      btnExportarGarantia.disabled = false;
      btnExportarGarantia.textContent = textoOriginal;
    });
  }
}

/* ============================= DETALHE ============================= */
function renderDetail(a){
  if(!a) return `<div class="empty">Atendimento não encontrado.</div>`;
  const st = (a.laudo && a.laudo.status) || 'em_teste';
  const motivo = a.laudo && a.laudo.motivo;
  const teste = a.teste || {};

  return `
    <div class="breadcrumb no-print"><button id="btn-back">← Voltar para lista</button></div>
    <div class="card">
      <div class="detail-header">
        <div>
          <div class="detail-title">${esc(a.cliente && a.cliente.nome) || 'Cliente não informado'}</div>
          <div class="detail-sub">Laudo ${esc(a.laudo_numero)} · ${fmtDate(a.data)} · ${esc(unidadeNome(a.unidade_id))}</div>
        </div>
        <span class="badge ${st}">${statusLabel(st)}</span>
      </div>

function bindDetailEvents(){
  const a = state.atendimentos.find(x=>x.id===currentDetailId);
  if(a && hasFotos(a)){
    loadFotosFor(a).then(fotos=>{
      const box = document.getElementById('foto-comprovante-box');
      if(!box) return;
      const validas = fotos.filter(Boolean);
      box.innerHTML = validas.length
        ? validas.map((foto,i)=>`<img class="foto-comprovante-img" data-i="${i}" src="data:image/jpeg;base64,${foto}" style="max-width:180px;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;">`).join('')
        : '<span class="muted">Não foi possível carregar as fotos.</span>';
      box.querySelectorAll('.foto-comprovante-img').forEach(img=>{
        img.addEventListener('click', ()=>{
          const big = img.style.maxWidth === '180px';
          img.style.maxWidth = big ? '420px' : '180px';
          img.style.maxHeight = big ? '420px' : '180px';
          img.style.cursor = big ? 'zoom-out' : 'zoom-in';
        });
      });
    });
  }
  document.getElementById('btn-back').addEventListener('click', ()=>{ currentDetailId=null; render(); });
  document.getElementById('btn-print-laudo').addEventListener('click', async ()=>{
    await printLaudo(state.atendimentos.find(a=>a.id===currentDetailId));
  });
  const btnDecl = document.getElementById('btn-print-declaracao');
  if(btnDecl) btnDecl.addEventListener('click', ()=>{
    printDeclaracao(state.atendimentos.find(a=>a.id===currentDetailId));
  });
  document.getElementById('btn-edit').addEventListener('click', ()=>{
    editingId = currentDetailId;
    currentTab = 'novo';
    currentDetailId = null;
    document.querySelectorAll('#tabnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='novo'));
    render();
  });
  document.getElementById('btn-delete').addEventListener('click', async ()=>{
    if(!confirm('Excluir este atendimento permanentemente?')) return;
    try{
      await api('/atendimentos/' + currentDetailId, { method:'DELETE' });
      state.atendimentos = state.atendimentos.filter(a=>a.id!==currentDetailId);
      toast('Atendimento excluído');
      currentDetailId = null;
      render();
    }catch(err){
      console.error('Erro ao excluir atendimento', err);
      toast('Erro ao excluir atendimento');
    }
  });
}

function bindUnidadesEvents(){
  const btnExport = document.getElementById('btn-export-backup');
  if(btnExport) btnExport.addEventListener('click', async ()=>{
    try{
      const all = await api('/backup/export');
      const blob = new Blob([JSON.stringify(all, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const hoje = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `heliar-backup-${hoje}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast('Backup exportado');
    }catch(e){ console.error('Erro ao exportar backup', e); toast('Erro ao exportar backup'); }
  });
  const btnImport = document.getElementById('btn-import-backup');
  const inputImport = document.getElementById('input-import-backup');
  if(btnImport && inputImport){
    btnImport.addEventListener('click', ()=> inputImport.click());
    inputImport.addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      inputImport.value = '';
      if(!file) return;
      if(!confirm('Importar este backup vai SUBSTITUIR todos os atendimentos e cadastros salvos no servidor. Continuar?')) return;
      try{
        const text = await file.text();
        const obj = JSON.parse(text);
        await api('/backup/import', { method:'POST', body: JSON.stringify(obj) });
        await loadState();
        toast('Backup importado');
        render();
      }catch(e){ console.error('Erro ao importar backup', e); toast('Erro ao importar backup — verifique se o arquivo é um backup válido'); }
    });
  }

  const form = document.getElementById('unit-form');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = formToObject(form);
    try{
      await createUnidade({ nome: data.nome, cnpj: data.cnpj||'', endereco: data.endereco||'' });
      toast('Unidade cadastrada');
      render();
    }catch(err){ toast('Erro ao cadastrar unidade: ' + err.message); }
  });
  document.querySelectorAll('.btn-del-unit').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      if(state.atendimentos.some(a=>a.unidade_id===id)){
        if(!confirm('Essa unidade já tem atendimentos vinculados. Excluir mesmo assim?')) return;
      } else if(!confirm('Excluir esta unidade?')) return;
      try{
        await deleteUnidade(id);
        toast('Unidade removida');
        render();
      }catch(err){ toast('Erro ao remover unidade: ' + err.message); }
    });
  });
  document.querySelectorAll('.btn-edit-unit').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      const u = state.unidades.find(u=>u.id===id);
      const novoNome = prompt('Nome da unidade', u.nome);
      if(novoNome===null) return;
      const novoCnpj = prompt('CNPJ', u.cnpj||'');
      if(novoCnpj===null) return;
      const novoEnd = prompt('Endereço', u.endereco||'');
      if(novoEnd===null) return;
      try{
        await updateUnidade(id, { nome:novoNome, cnpj:novoCnpj, endereco:novoEnd });
        toast('Unidade atualizada'); render();
      }catch(err){ toast('Erro ao atualizar unidade: ' + err.message); }
    });
  });

  const tecForm = document.getElementById('tecnico-form');
  tecForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = formToObject(tecForm);
    if(!data.unidade_id){ toast('Selecione a unidade do técnico'); return; }
    try{
      await createTecnico({ nome: data.nome, cpf: data.cpf||'', unidade_id: data.unidade_id });
      toast('Técnico cadastrado');
      render();
    }catch(err){ toast('Erro ao cadastrar técnico: ' + err.message); }
  });
  document.querySelectorAll('.btn-del-tecnico').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      if(!confirm('Excluir este técnico?')) return;
      try{
        await deleteTecnico(id);
        toast('Técnico removido');
        render();
      }catch(err){ toast('Erro ao remover técnico: ' + err.message); }
    });
  });
  document.querySelectorAll('.btn-edit-tecnico').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      const t = state.tecnicos.find(t=>t.id===id);
      const novoNome = prompt('Nome do técnico', t.nome);
      if(novoNome===null) return;
      const novoCpf = prompt('CPF', t.cpf||'');
      if(novoCpf===null) return;
      try{
        await updateTecnico(id, { nome:novoNome, cpf:novoCpf });
        toast('Técnico atualizado'); render();
      }catch(err){ toast('Erro ao atualizar técnico: ' + err.message); }
    });
  });

  const marcaForm = document.getElementById('marca-form');
  marcaForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = formToObject(marcaForm);
    try{
      await createMarca({ nome: data.nome });
      toast('Marca cadastrada');
      render();
    }catch(err){ toast('Erro ao cadastrar marca: ' + err.message); }
  });
  document.querySelectorAll('.btn-del-marca').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      if(!confirm('Excluir esta marca?')) return;
      try{
        await deleteMarca(id);
        toast('Marca removida');
        render();
      }catch(err){ toast('Erro ao remover marca: ' + err.message); }
    });
  });
}

      await api('/users', { method:'POST', body: JSON.stringify({
        nome: data.nome, login: data.login, senha: data.senha, role: data.role, unidade_id: data.unidade_id || null
      })});
      toast('Usuário cadastrado');
      render();
    }catch(err){ toast('Erro ao cadastrar usuário: ' + err.message); }
  });

      const card = e.target.closest('.unit-card');

      if(nome===null) return;
      const role = prompt('Papel (admin, gestor ou tecnico)');

        toast('Usuário atualizado'); render();
      }catch(err){ toast('Erro ao atualizar usuário: ' + err.message); }
    });
  });

      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;

      if(!nova) return;
      try{
        await api('/users/'+id+'/senha', { method:'POST', body: JSON.stringify({ senha_nova: nova }) });
        toast('Senha redefinida — informe a nova senha ao usuário');
      }catch(err){ toast('Erro ao redefinir senha: ' + err.message); }
    });
  });
  document.querySelectorAll('.btn-toggle-user').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      const ativando = btn.textContent.trim() === 'Ativar';
      if(!confirm((ativando?'Ativar':'Desativar') + ' este usuário?')) return;
      try{
        await api('/users/'+id, { method:'PUT', body: JSON.stringify({ ativo: ativando }) });
        toast('Usuário ' + (ativando?'ativado':'desativado'));
        render();
      }catch(err){ toast('Erro: ' + err.message); }
    });
  });
  document.querySelectorAll('.btn-delete-user').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const card = e.target.closest('.unit-card');
      const id = card.dataset.id;
      const nome = card.querySelector('div[style*="font-weight"]').textContent.trim();

      try{
        await api('/users/'+id, { method:'DELETE' });
        toast('Usuário excluído');
        render();
      }catch(err){ toast('Erro ao excluir usuário: ' + err.message); }
    });
  });
}

  `;
  document.getElementById('btn-sair').addEventListener('click', logout);
  document.getElementById('btn-trocar-senha').addEventListener('click', abrirModalTrocarSenha);
}
function abrirModalTrocarSenha(){
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal">
      <div class="section-title">Trocar minha senha</div>
      <form id="form-trocar-senha">
        <div class="field" style="margin-bottom:10px;"><label>Senha atual</label><input type="password" name="senha_atual" required></div>
        <div class="field" style="margin-bottom:10px;"><label>Nova senha (mín. 6 caracteres)</label><input type="password" name="senha_nova" required></div>
        <div class="field" style="margin-bottom:10px;"><label>Confirmar nova senha</label><input type="password" name="senha_confirma" required></div>
        <div class="btn-row">
          <button type="submit" class="btn primary">Salvar nova senha</button>
          <button type="button" class="btn" id="btn-cancelar-senha">Cancelar</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(back);
  back.addEventListener('click', (e)=>{ if(e.target===back) back.remove(); });
  document.getElementById('btn-cancelar-senha').addEventListener('click', ()=> back.remove());
  document.getElementById('form-trocar-senha').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = formToObject(e.target);
    if(data.senha_nova !== data.senha_confirma){ toast('A confirmação não confere com a nova senha'); return; }
    try{
      await api('/auth/senha', { method:'PUT', body: JSON.stringify({ senha_atual: data.senha_atual, senha_nova: data.senha_nova }) });
      toast('Senha alterada com sucesso');
      back.remove();
    }catch(err){ toast('Erro ao trocar senha: ' + err.message); }
  });
}

/* ============================= INIT ============================= */
(async function init(){
  const user = await checkAuth();
  if(!user){ goToLogin(); return; }
  currentUser = user;
  renderUserBox();
  if(currentUser.role === 'admin'){
    document.getElementById('tab-usuarios').style.display = '';
  }
  if(currentUser.role !== 'tecnico'){
    document.getElementById('tab-cadastros').style.display = '';
  }
  try{
    await loadState();
  }catch(e){
    console.error('Erro ao carregar dados iniciais', e);
    toast('Erro ao carregar dados do servidor — recarregue a página');
    return;
  }
  setTab('novo');
})();
</script>
